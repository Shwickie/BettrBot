# render.yaml - Fixed cloud deployment config
services:
  # Main web app
  - type: web
    name: bettr-bot-web
    runtime: python
    repo: https://github.com/Shwickie/BettrBot
    branch: main
    buildCommand: |
      python --version
      pip install --upgrade pip
      pip install -r requirements.txt
      python -c "
      import pickle, numpy as np, os
      from sklearn.ensemble import RandomForestClassifier
      if not os.path.exists('./betting_model_fixed.pkl'):
          print('Creating fallback model...')
          model = RandomForestClassifier(n_estimators=10, random_state=42)
          X = np.random.randn(50, 20)
          y = np.random.randint(0, 2, 50)
          model.fit(X, y)
          with open('./betting_model_fixed.pkl', 'wb') as f:
              pickle.dump({'model': model, 'feature_cols': [f'f{i}' for i in range(20)], 'scaler': None}, f)
          print('Fallback model created')
      "
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: postgresql://postgres:QAmpFszazifVixDGzdvWNXJTdzoXFgYw@maglev.proxy.rlwy.net:48520/railway
      - key: FLASK_ENV
        value: production
      - key: BETTR_MODEL_PKL
        value: ./betting_model_fixed.pkl
      - key: BETTR_PIPELINE_MODE
        value: "false"

  # Pipeline - Every 4 hours
  - type: cron
    name: bettr-bot-pipeline-4hr
    runtime: python
    repo: https://github.com/Shwickie/BettrBot
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python cloud/cloud_run_all.py
    schedule: "0 */4 * * *"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: postgresql://postgres:QAmpFszazifVixDGzdvWNXJTdzoXFgYw@maglev.proxy.rlwy.net:48520/railway
      - key: BETTR_PIPELINE_MODE
        value: "true"
      - key: PYTHONIOENCODING
        value: "utf-8"
        
  # Daily maintenance
  - type: cron
    name: bettr-bot-daily-maintenance
    runtime: python
    repo: https://github.com/Shwickie/BettrBot
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python cloud/cloud_run_all.py
    schedule: "0 3 * * *"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: postgresql://postgres:QAmpFszazifVixDGzdvWNXJTdzoXFgYw@maglev.proxy.rlwy.net:48520/railway
      - key: BETTR_PIPELINE_MODE
        value: "true"
      - key: PYTHONIOENCODING
        value: "utf-8"