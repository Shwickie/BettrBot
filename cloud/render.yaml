# render_fixed.yaml - WORKING cloud deployment config
services:
  - type: web
    name: bettr-bot-web
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python verify_deployment.py
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      - key: BETTR_MODEL_PKL
        value: ./betting_model_fixed.pkl
      - key: BETTR_PIPELINE_MODE
        value: "false"

  - type: cron
    name: bettr-bot-pipeline
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud_run_all_fixed.py
    schedule: "0 */4 * * *"  # every 4 hours
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: BETTR_PIPELINE_MODE
        value: "true"