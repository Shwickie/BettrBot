# render_fixed.yaml - WORKING cloud deployment config with automated scheduling
services:
  - type: web
    name: bettr-bot-web
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python verify_deployment.py
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      - key: BETTR_MODEL_PKL
        value: ./betting_model_fixed.pkl
      - key: BETTR_PIPELINE_MODE
        value: "false"
      - key: ENABLE_SCHEDULER
        value: "true"

  # Cron job for pipeline updates
  - type: cron
    name: bettr-bot-pipeline
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud_run_all.py
    schedule: "0 */4 * * *"  # Every 4 hours
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: BETTR_PIPELINE_MODE
        value: "true"
        
  # Daily maintenance job
  - type: cron
    name: bettr-bot-maintenance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python automated_scheduler.py
    schedule: "0 6 * * *"  # Daily at 6 AM UTC
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: BETTR_PIPELINE_MODE
        value: "true"