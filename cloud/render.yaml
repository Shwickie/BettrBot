# render.yaml - Cloud deployment config with automated cron jobs
# This runs cloud_run_all.py automatically in the cloud (even when PC is off)

services:
  # Main web app (your dashboard)
  - type: web
    name: bettr-bot-web
    runtime: python
    repo: https://github.com/Shwickie/BettrBot
    branch: main
    buildCommand: |
      pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: postgresql://postgres:QAmpFszazifVixDGzdvWNXJTdzoXFgYw@maglev.proxy.rlwy.net:48520/railway
      - key: FLASK_ENV
        value: production
      - key: BETTR_MODEL_PKL
        value: ./betting_model_fixed.pkl
      - key: BETTR_PIPELINE_MODE
        value: "false"

  # MAIN AUTOMATED PIPELINE - Runs every 4 hours
  - type: cron
    name: bettr-bot-pipeline-4hr
    runtime: python
    repo: https://github.com/Shwickie/BettrBot
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud/cloud_run_all.py
    schedule: "0 */4 * * *"  # Every 4 hours: 12am, 4am, 8am, 12pm, 4pm, 8pm UTC
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: postgresql://postgres:QAmpFszazifVixDGzdvWNXJTdzoXFgYw@maglev.proxy.rlwy.net:48520/railway
      - key: BETTR_PIPELINE_MODE
        value: "true"
      - key: PYTHONIOENCODING
        value: "utf-8"
        
  # DAILY MAINTENANCE - Runs once per day
  - type: cron
    name: bettr-bot-daily-maintenance
    runtime: python
    repo: https://github.com/Shwickie/BettrBot
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud/cloud_run_all.py
    schedule: "0 3 * * *"  # Daily at 3 AM UTC (11 PM EST / 10 PM EDT)
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: postgresql://postgres:QAmpFszazifVixDGzdvWNXJTdzoXFgYw@maglev.proxy.rlwy.net:48520/railway
      - key: BETTR_PIPELINE_MODE
        value: "true"
      - key: PYTHONIOENCODING
        value: "utf-8"